<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Pagely · כניסה</title>
<meta name="description" content="Pagely — מערכת דפי נחיתה. כניסה לניהול הדף שלכם.">
<meta name="theme-color" content="#e2603c">
<link rel="icon" type="image/svg+xml" href="assets/placeholders/favicon.svg?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@1.51.0/dist/umd/lucide.min.js"></script>
<style>
/* ============================================================
   Pagely Login — Assistant · Lucide · כתום על ניטרלי
   ============================================================ */
:root{
  --accent:#e2603c;--accent-d:#c14e2e;--accent-soft:#fdeee8;--accent-ring:rgba(226,96,60,.16);
  --ink:#111827;--text:#374151;--muted:#6b7280;
  --line:#e5e7eb;--line-strong:#d1d5db;--bg:#f5f6f8;--card:#fff;--soft:#f9fafb;
  --err:#c0392b;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Assistant',sans-serif;color:var(--text);font-size:15px;-webkit-font-smoothing:antialiased;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow-x:hidden;background:var(--bg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* רקע — ניטרלי עם הילה כתומה עדינה ורשת נקודות חיוורת */
.bg-glow{position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(560px 380px at 50% -8%,var(--accent-soft),transparent 70%),
  radial-gradient(circle at 50% 0%,transparent 0,transparent 100%)}
.bg-dots{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(rgba(17,24,39,.055) 1px,transparent 1px);background-size:26px 26px;mask-image:linear-gradient(180deg,#000 0%,transparent 72%);-webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 72%)}

.card{position:relative;z-index:2;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:42px 36px 34px;width:min(410px,94vw);box-shadow:0 18px 44px rgba(17,24,39,.10);text-align:center;animation:cardIn .5s cubic-bezier(.2,.7,.2,1)}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.card{animation:none}}

/* לוגו — ארבעה רסיסים לצד המילה */
.logo{display:flex;flex-direction:column;align-items:center;gap:13px;margin-bottom:6px}
.blocks{display:grid;grid-template-columns:24px 24px;grid-template-rows:24px 24px;gap:5px;transform:rotate(-6deg)}
.blocks i{border-radius:7px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.16),0 3px 8px rgba(17,24,39,.14);animation:pop .5s cubic-bezier(.18,.9,.28,1.35) backwards}
.blocks i:nth-child(1){background:#e2603c}
.blocks i:nth-child(2){background:#f2b33d;animation-delay:.08s}
.blocks i:nth-child(3){background:#2ea6a0;animation-delay:.16s}
.blocks i:nth-child(4){background:#f08ca5;animation-delay:.24s}
@keyframes pop{from{transform:scale(0) rotate(-30deg)}to{transform:scale(1) rotate(0)}}
@media(prefers-reduced-motion:reduce){.blocks i{animation:none}}
.logo-txt{font-size:31px;font-weight:800;color:var(--ink);letter-spacing:-.5px}
.logo-txt b{color:var(--accent)}

.card h1{font-size:21px;font-weight:700;color:var(--ink);margin-top:12px}
.card .sub{color:var(--muted);margin-top:7px;font-size:14px;line-height:1.6}
.card .sub b{color:var(--text)}

form{margin-top:26px;text-align:right}
.fld{position:relative;margin-bottom:15px}
.fld label{display:block;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:6px}
.fld .f-ico{position:absolute;bottom:11px;inset-inline-start:12px;color:var(--muted);pointer-events:none;display:flex}
.fld .f-ico svg.lucide{width:16px;height:16px}
.fld input{width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:11px 12px;padding-inline-start:37px;font-size:15px;font-family:'Assistant',sans-serif;background:var(--card);color:var(--text);min-height:44px;transition:border-color .15s,box-shadow .15s}
.fld input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-ring)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;border:none;cursor:pointer;border-radius:8px;padding:13px;font-size:15px;font-weight:700;font-family:'Assistant',sans-serif;min-height:44px;background:var(--accent);color:#fff;transition:background .15s,transform .1s}
.btn svg.lucide{width:17px;height:17px}
.btn:hover{background:var(--accent-d);transform:translateY(-1px)}
.btn:active{transform:none}
.btn:disabled{opacity:.6;cursor:wait;transform:none}
.err{color:var(--err);font-size:13.5px;margin-top:12px;min-height:18px}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

.foot{margin-top:20px;color:var(--muted);font-size:12.5px}
.foot b{color:var(--text);font-weight:600}
.spin{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite;display:none}
.btn.loading .spin{display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
</style>
<link rel="stylesheet" href="assets/admin/ui.css">
</head>
<body class="grain">

<div class="bg-glow" aria-hidden="true"></div>
<div class="bg-dots" aria-hidden="true"></div>

<form class="card" id="loginForm" autocomplete="off">
  <div class="logo" aria-hidden="true">
    <div class="blocks"><i></i><i></i><i></i><i></i></div>
    <div class="logo-txt">page<b>ly</b></div>
  </div>
  <h1>ברוכים הבאים</h1>
  <p class="sub">כניסה לניהול דף הנחיתה שלכם<br>כל דף מקבל כתובת משלו — <b>/שם-הדף</b></p>
  <div class="fld">
    <label for="lu">שם משתמש</label>
    <span class="f-ico"><i data-lucide="user-round"></i></span>
    <input type="text" id="lu" autocomplete="username" autofocus>
  </div>
  <div class="fld">
    <label for="lp">סיסמה</label>
    <span class="f-ico"><i data-lucide="lock"></i></span>
    <input type="password" id="lp" autocomplete="current-password">
  </div>
  <button class="btn" type="submit" id="btnLogin"><span class="spin" aria-hidden="true"></span><i data-lucide="log-in"></i><span id="btnTxt">כניסה</span></button>
  <div class="err" id="loginErr"></div>
  <div class="foot">Pagely — מערכת דפי נחיתה · <b>כל דף הוא עולם קטן משלו</b></div>
</form>

<script>
try{window.lucide&&lucide.createIcons();}catch(e){}

const TOKEN_KEY='pagely-token';
const $id=id=>document.getElementById(id);

/* אם כבר מחוברים — ממשיכים ישר הלאה */
(async()=>{
  const t=sessionStorage.getItem(TOKEN_KEY);
  if(!t)return;
  try{
    const r=await fetch('/api/auth',{headers:{'Authorization':'Bearer '+t},cache:'no-store'});
    if(r.ok){
      const j=await r.json();
      location.replace(j.role==='superadmin'?'/superadmin':'/admin');
    }else{sessionStorage.removeItem(TOKEN_KEY);}
  }catch(e){}
})();

$id('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const u=$id('lu').value.trim(),p=$id('lp').value;
  const err=$id('loginErr'),btn=$id('btnLogin');
  if(!u||!p){err.textContent='נדרשים שם משתמש וסיסמה';return;}
  btn.disabled=true;btn.classList.add('loading');$id('btnTxt').textContent='מתחברים…';err.textContent='';
  try{
    const r=await fetch('/api/auth',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'login',username:u,password:p}),
      cache:'no-store'
    });
    const j=await r.json().catch(()=>({}));
    if(r.ok&&j.ok&&j.token){
      sessionStorage.setItem(TOKEN_KEY,j.token);
      location.replace(j.role==='superadmin'?'/superadmin':'/admin');
      return;
    }
    err.textContent=j.error||'שם משתמש או סיסמה שגויים';
  }catch(e2){
    err.textContent='שגיאת רשת — נסו שוב';
  }
  btn.disabled=false;btn.classList.remove('loading');$id('btnTxt').textContent='כניסה';
  const card=document.querySelector('.card');
  card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');
});
</script>
</body>
</html>
