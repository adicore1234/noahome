<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Pagely">
  <defs>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff9774"/><stop offset="1" stop-color="#e2603c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffd56f"/><stop offset="1" stop-color="#f2b33d"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#67d2cb"/><stop offset="1" stop-color="#32aaa2"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f7adc0"/><stop offset="1" stop-color="#e67f9b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#102a43" flood-opacity=".22"/>
    </filter>
  </defs>
  <g transform="rotate(-5 32 32)" filter="url(#shadow)">
    <rect x="7" y="7" width="23" height="23" rx="7" fill="url(#coral)"/>
    <rect x="34" y="7" width="23" height="23" rx="7" fill="url(#gold)"/>
    <rect x="7" y="34" width="23" height="23" rx="7" fill="url(#teal)"/>
    <rect x="34" y="34" width="23" height="23" rx="7" fill="url(#pink)"/>
  </g>
</svg>
